# ~/.tmux.conf - shared by light and full mode.
set -g default-terminal "screen-256color"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# Full mode extras
if-shell '[ "$(cat ~/.dotfiles_mode 2>/dev/null)" = full ]' 'source-file ~/.dotfiles/tmux/full.conf'

# Per-machine tweaks (untracked)
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'
